name: Archipelago Validate

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - codex/ap-world-skeleton-checkpoint
      - codex/ap-item-location-framework
  pull_request:
    branches:
      - main
      - codex/ap-world-skeleton-checkpoint
  workflow_dispatch:

jobs:
  validate:
    name: Validate Archipelago Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Archipelago generation and validation suite
        run: python scripts/archipelago_run_checks.py

      - name: Check generated outputs are committed
        run: |
          git diff --exit-code -- \
            Data/Archipelago/ingame_names.json \
            Data/Archipelago/template_ingame_names.json \
            Data/Archipelago/generated_challenge_unit_protection_report.txt \
            Data/Archipelago/generated_unit_matchup_graph.json \
            Data/Archipelago/generated_unit_matchup_graph.csv \
            Data/Archipelago/generated_unit_matchup_graph_readable.txt \
            Data/INI/Archipelago.ini \
            Data/INI/ArchipelagoChallengeUnitProtection.ini
          test -z "$(git ls-files --others --exclude-standard -- Data/Archipelago Data/INI)"

      - name: Upload Archipelago artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archipelago-validation-artifacts
          path: |
            Data/Archipelago/generated_unit_matchup_graph.json
            Data/Archipelago/generated_unit_matchup_graph.csv
            Data/Archipelago/generated_unit_matchup_graph_readable.txt
            Data/Archipelago/ingame_names.json
            Data/INI/Archipelago.ini
            build/archipelago/archipelago_audit_report.md
            build/archipelago/archipelago_leftovers.txt
          retention-days: 7
          if-no-files-found: ignore

  framework-contracts:
    name: Validate AP Framework Contracts
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run AP data pipeline contract tests
        run: python scripts\tests\test_archipelago_data_pipeline.py

      - name: Run AP world contract tests
        run: python scripts\tests\test_archipelago_world_contract.py

      - name: Run Logic Foundry export handoff smoke
        id: logic_foundry_export_smoke
        shell: pwsh
        run: |
          npm --prefix tools\logic-foundry ci
          npm --prefix tools\logic-foundry run build
          npm --prefix tools\logic-foundry run export:contract -- --out ..\..\build\archipelago\logic-foundry-export-smoke.json
          python scripts\archipelago_logic_contract_validate.py --foundry-output build\archipelago\logic-foundry-export-smoke.json

      - name: Run package fixture smoke
        id: package_smoke
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\smoke_generalsap_alpha_package.ps1 -UseFixtureRuntime -OutputDir build\archipelago\ci-package-smoke

      - name: Build bridge for network smokes
        id: bridge_build
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\build_generalsap_bridge.ps1 -OutputPath build\release-tools\GeneralsAPBridge.exe

      - name: Install bridge smoke dependencies
        run: python -m pip install --disable-pip-version-check -r scripts\requirements-archipelago-smoke.txt

      - name: Run bridge file-mode smoke
        id: bridge_file_smoke
        run: python scripts\archipelago_bridge_executable_smoke.py --bridge-exe build\release-tools\GeneralsAPBridge.exe --keep-temp

      - name: Run bridge fake AP network smoke
        id: bridge_fake_network_smoke
        run: python scripts\archipelago_bridge_network_smoke.py --bridge-exe build\release-tools\GeneralsAPBridge.exe --keep-temp

      - name: Run bridge real local AP server smoke
        id: bridge_real_ap_smoke
        run: python scripts\archipelago_bridge_real_ap_server_smoke.py --bridge-exe build\release-tools\GeneralsAPBridge.exe --keep-temp

      - name: Run bridge full AP world simulation smoke
        id: bridge_full_world_smoke
        run: python scripts\archipelago_bridge_real_ap_server_smoke.py --bridge-exe build\release-tools\GeneralsAPBridge.exe --full-world-simulation --keep-temp

      - name: Run branch scope audit
        if: github.event_name == 'pull_request'
        run: python scripts\archipelago_pr_scope_audit.py --base origin/${{ github.base_ref }} --head HEAD

      - name: Run framework branch scope audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ap-item-location-framework'
        run: python scripts\archipelago_pr_scope_audit.py --base origin/codex/ap-world-skeleton-checkpoint --head HEAD

      - name: Stage AP framework smoke artifacts
        if: always()
        shell: pwsh
        run: |
          $stage = Join-Path (Get-Location) "build\archipelago\ci-framework-smoke-artifacts"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $strict = @(
            '${{ steps.package_smoke.outcome }}',
            '${{ steps.bridge_build.outcome }}',
            '${{ steps.bridge_file_smoke.outcome }}',
            '${{ steps.bridge_fake_network_smoke.outcome }}',
            '${{ steps.bridge_real_ap_smoke.outcome }}',
            '${{ steps.bridge_full_world_smoke.outcome }}',
            '${{ steps.logic_foundry_export_smoke.outcome }}'
          ) | Where-Object { $_ -ne 'success' } | Measure-Object | Select-Object -ExpandProperty Count
          $requireCompleteArtifacts = ($strict -eq 0)

          $requiredSources = @(
            @{ Label = "bridge executable"; Source = "build\release-tools\GeneralsAPBridge.exe" },
            @{ Label = "package smoke output"; Source = "build\archipelago\ci-package-smoke" },
            @{ Label = "Logic Foundry export smoke"; Source = "build\archipelago\logic-foundry-export-smoke.json" }
          )
          foreach ($entry in $requiredSources) {
            if (Test-Path -LiteralPath $entry.Source) {
              Copy-Item -LiteralPath $entry.Source -Destination $stage -Recurse -Force
            } elseif ($requireCompleteArtifacts) {
              throw "Missing required AP framework smoke artifact: $($entry.Label) at $($entry.Source)"
            } else {
              Write-Warning "Missing partial AP framework smoke artifact: $($entry.Label) at $($entry.Source)"
            }
          }

          $tempRoot = [System.IO.Path]::GetTempPath()
          $requiredTempPrefixes = @(
            "generalsap-bridge-exe-*",
            "generalsap-bridge-network-*",
            "generalsap-real-ap-server-*"
          )
          foreach ($prefix in $requiredTempPrefixes) {
            $matches = @(Get-ChildItem -LiteralPath $tempRoot -Directory -Filter $prefix -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
            if ($matches.Count -eq 0) {
              if ($requireCompleteArtifacts) {
                throw "Missing retained smoke temp directory matching $prefix under $tempRoot"
              }
              Write-Warning "Missing partial retained smoke temp directory matching $prefix under $tempRoot"
              continue
            }
            foreach ($dir in $matches) {
              Copy-Item -LiteralPath $dir.FullName -Destination $stage -Recurse -Force
            }
          }

          $manifest = [ordered]@{
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            tempRoot = $tempRoot
            requireCompleteArtifacts = $requireCompleteArtifacts
            packageSmokeOutcome = '${{ steps.package_smoke.outcome }}'
            bridgeBuildOutcome = '${{ steps.bridge_build.outcome }}'
            bridgeFileSmokeOutcome = '${{ steps.bridge_file_smoke.outcome }}'
            bridgeFakeNetworkSmokeOutcome = '${{ steps.bridge_fake_network_smoke.outcome }}'
            bridgeRealApSmokeOutcome = '${{ steps.bridge_real_ap_smoke.outcome }}'
            bridgeFullWorldSmokeOutcome = '${{ steps.bridge_full_world_smoke.outcome }}'
            logicFoundryExportSmokeOutcome = '${{ steps.logic_foundry_export_smoke.outcome }}'
            files = @(Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { $_.FullName.Substring($stage.Length + 1) } | Sort-Object)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $stage "artifact-manifest.json") -Encoding UTF8

          if ($requireCompleteArtifacts) {
            foreach ($prefix in $requiredTempPrefixes) {
              $stagedMatches = @(Get-ChildItem -LiteralPath $stage -Directory -Filter $prefix -ErrorAction SilentlyContinue)
              if ($stagedMatches.Count -eq 0) {
                throw "Retained smoke temp directory $prefix was not staged into $stage"
              }
            }
          }

      - name: Upload AP framework smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap-framework-smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: build\archipelago\ci-framework-smoke-artifacts
          retention-days: 7
          if-no-files-found: error

  generalsmd-runtime-compile:
    name: Compile GeneralsMD Runtime Smoke
    uses: ./.github/workflows/build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: "win32-vcpkg-playtest"
      tools: false
      extras: false
